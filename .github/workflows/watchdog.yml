name: ChomeNS Watchdog

on:
  workflow_dispatch:

jobs:
  watchdog:
    runs-on: ubuntu-latest

    permissions:
      actions: write
      contents: read

    steps:
      - name: Check bot workflow
        id: check
        run: |
          RUNNING=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/run-bot.yml/runs?status=in_progress" \
            | jq '.total_count')

          echo "running=$RUNNING" >> $GITHUB_OUTPUT

      - name: Ping Healthchecks if bot is running
        if: steps.check.outputs.running != '0'
        run: |
          curl -fsS \
          https://hc-ping.com/0d4f55ce-cac4-4d7c-9c4e-b00fe02296ee

      - name: Start bot if not running
        if: steps.check.outputs.running == '0'
        run: |
          echo "Bot is not running. Starting..."

          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/run-bot.yml/dispatches \
            -d '{"ref":"main"}'
