name: Run ChomeNS Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */5 * * *"

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull Git LFS files
        run: |
          git lfs install
          git lfs pull

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Verify jar
        run: |
          ls -lh chomens.jar
          file chomens.jar
          jar tf chomens.jar > /dev/null
          echo "Jar is valid"

      - name: Generate config.yml
        run: |
          sed \
          -e "s|__DB_PASSWORD__|${{ secrets.DB_PASSWORD }}|g" \
          -e "s|__DISCORD_TOKEN__|${{ secrets.DISCORD_TOKEN }}|g" \
          config.example.yml > config.yml

      - name: Run bot
        run: |
          stdbuf -oL -eL java -jar chomens.jar 2>&1 | tee bot.log &
          PID=$!

          tail -Fn0 bot.log | while read line; do

            echo "$line"

            # Detect standalone "-" crash command
            if echo "$line" | grep -Eq '^[[:space:]]*-$'; then
              echo "Detected standalone - crash command"
              kill $PID || true
              exit 1
            fi

            # Detect NBT crash command dumps
            if echo "$line" | grep -Eq 'seenCredits:|DeathTime:|Paper\.Origin:|UUID: \[I;|Pos: \['; then
              echo "Detected crash-command NBT dump"
              kill $PID || true
              exit 1
            fi

            # Detect disconnect:
            # [anything Info] [anything] [anything] Disconnected:anything
            if echo "$line" | grep -Eq '^\[.* Info\] \[.*\] \[.*\] Disconnected:.*$'; then
              echo "Detected bot disconnect"
              kill $PID || true
              exit 1
            fi

          done

          wait $PID

      - name: Start fresh workflow after failure
        if: failure()
        run: |
          echo "Starting replacement workflow..."

          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/run-bot.yml/dispatches \
            -d '{"ref":"main"}'
