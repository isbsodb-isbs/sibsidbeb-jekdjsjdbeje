name: Run ChomeNS Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    services:
      mariadb:
        image: mariadb:11
        ports:
          - 3306:3306
        env:
          MARIADB_DATABASE: chomens_bot
          MARIADB_USER: chomens_bot
          MARIADB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MARIADB_ROOT_PASSWORD: rootpassword
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull Git LFS files
        run: |
          git lfs install
          git lfs pull

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Verify jar
        run: |
          ls -lh chomens.jar
          file chomens.jar
          jar tf chomens.jar > /dev/null
          echo "Jar is valid"

      - name: Generate config.yml
        run: |
          sed \
          -e "s|__DB_PASSWORD__|${{ secrets.DB_PASSWORD }}|g" \
          -e "s|__DISCORD_TOKEN__|${{ secrets.DISCORD_TOKEN }}|g" \
          config.example.yml > config.yml

      - name: Run bot
        id: bot
        run: |
          set -e

          java -jar chomens.jar 2>&1 | tee bot.log &
          BOT_PID=$!

          while kill -0 $BOT_PID 2>/dev/null; do
            if grep -qx -- "-" bot.log; then
              echo "Found standalone '-' in logs"
              kill $BOT_PID || true
              exit 1
            fi

            sleep 1
          done

          wait $BOT_PID

      - name: Start fresh workflow after failure
        if: failure()
        run: |
          echo "Starting replacement workflow..."

          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/run-bot.yml/dispatches \
            -d '{"ref":"main"}'
