
name: Run ChomeNS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chomens-bot
  cancel-in-progress: true

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull the LFS thingys
        run: |
          git lfs install
          git lfs pull

      - name: Setup Java 21 bcos github doesnt want to
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Verify jar if i am stupid or not
        run: |
          test -f chomens.jar
          jar tf chomens.jar >/dev/null
          echo "Jar OK"

      - name: Configure
        run: |
          PREFIX=$(cat /dev/urandom | tr -dc 'A-Za-z0-9' | head -c 16)

          sed \
          -e "s|__DB_PASSWORD__|${{ secrets.DB_PASSWORD }}|g" \
          -e "s|__DISCORD_TOKEN__|${{ secrets.DISCORD_TOKEN }}|g" \
          -e "s|__DFNGBOOM__|${{ secrets.DFNGBOOM }}|g" \
          -e "s|__PREFIX__|$PREFIX|g" \
          config.example.yml > config.yml

      - name: Start timer to reset
        run: |
          (
            DELAY=$((3600 + RANDOM % 3601))
            echo "Replacement scheduled in $DELAY seconds"

            sleep "$DELAY"

            echo "Requesting graceful shutdown"

            curl \
              -X POST \
              -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel

            sleep 5

            echo "Starting replacement"

            curl \
              -X POST \
              -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/actions/workflows/run-bot.yml/dispatches \
              -d '{"ref":"main"}'

            echo "Replacement started"
          ) &

      - name: Install remote terminal tools
        run: |
          sudo curl -sSLo /usr/local/bin/ttyd https://github.com/tsl0922/ttyd/releases/latest/download/ttyd.x86_64
          sudo chmod +x /usr/local/bin/ttyd

          curl -sSLo cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

          echo "Node:"
          node -v

          echo "NPM:"
          npm -v


          echo "Building eval Docker container"

          docker build \
            -t chomens-eval \
            ./eval


          echo "Removing old eval container"

          docker rm -f chomens-eval 2>/dev/null || true


          echo "Starting eval container"

          docker run \
            -d \
            --name chomens-eval \
            --read-only \
            -v /var/run/docker.sock:/var/run/docker.sock \
            --security-opt=no-new-privileges:true \
            --memory=2g \
            --cpus=1 \
            --pids-limit=50 \
            --tmpfs /tmp:size=128m,noexec,nosuid \
            --tmpfs /run:size=64m \
            --log-opt max-size=10m \
            --log-opt max-file=3 \
            -p 127.0.0.1:3000:3000 \
            chomens-eval

          (
            while true; do

              RUNNING=$(docker inspect \
                -f '{{.State.Running}}' \
                chomens-eval 2>/dev/null || echo false)


              if [ "$RUNNING" != "true" ]; then

                echo "[Eval Watchdog] Container stopped, recreating"


                docker rm -f chomens-eval 2>/dev/null || true


                docker build \
                  --no-cache \
                  -t chomens-eval \
                  ./eval


                docker run \
                  -d \
                  --name chomens-eval \
                  --read-only \
                  -v /var/run/docker.sock:/var/run/docker.sock \
                  --security-opt=no-new-privileges:true \
                  --memory=2g \
                  --tmpfs /tmp:size=128m,noexec,nosuid \
                  --tmpfs /run:size=64m \
                  --cpus 1 \
                  --pids-limit 50 \
                  --log-opt max-size=10m \
                  --log-opt max-file=3 \
                  -p 127.0.0.1:3000:3000 \
                  chomens-eval


                echo "[Eval Watchdog] Container recreated"

              fi


              sleep 30

            done
          ) &
          sleep 5


          echo "Eval container status"

          docker ps --filter name=chomens-eval


          echo "Eval logs"

          docker logs chomens-eval


          echo "Eval Docker started"
      - name: Run bot
        id: run_bot
        env:
          GH_OAUTH_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
          GH_OAUTH_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
        run: |
          set +e

          rm -f /tmp/chomens_exit_code

          cat > run-chomens.sh <<'EOF'
          #!/bin/bash

          java -Xms3G -Xmx3G \
          -XX:+UseG1GC \
          -XX:MaxGCPauseMillis=100 \
          -XX:+ParallelRefProcEnabled \
          -XX:+AlwaysPreTouch \
          -XX:+DisableExplicitGC \
          -jar chomens2.jar

          code=$?

          echo $code > /tmp/chomens_exit_code

          exit $code
          EOF

          chmod +x run-chomens.sh

          tmux new-session -d -s chomens "./run-chomens.sh; touch /tmp/chomens_tmux_stopped"

          ttyd -W -p 7681 tmux attach -t chomens >/dev/null 2>&1 &

          node auth-proxy.js >/dev/null 2>&1 &

          cloudflared tunnel --no-autoupdate run \
            --token "${{ secrets.CF_TUNNEL_TOKEN }}" >/dev/null 2>&1 &

          echo "Services started"

          trap '
          echo "Shutdown requested"

          tmux send-keys -t chomens C-u 2>/dev/null
          tmux send-keys -t chomens ".stop restarting, can take up to a minute" 2>/dev/null
          tmux send-keys -t chomens Enter 2>/dev/null

          echo "Waiting for graceful shutdown..."

          while [ ! -f /tmp/chomens_exit_code ] && [ ! -f /tmp/chomens_tmux_stopped ]; do
            sleep 5
          done

          echo "Graceful shutdown failed, forcing stop"

          tmux send-keys -t chomens C-c 2>/dev/null
          sleep 1
          tmux kill-session -t chomens 2>/dev/null

          exit 0
          ' TERM INT

          while [ ! -f /tmp/chomens_exit_code ]; do

            if ! pgrep -f "java.*chomens2.jar" >/dev/null; then
              echo "Java process disappeared"

              echo 1 > /tmp/chomens_exit_code
              break
            fi

            sleep 5

          done

          code=$(cat /tmp/chomens_exit_code 2>/dev/null || echo 1)

          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "Bot process exited with code $code"

      - name: Restart after crash
        if: always()
        run: |
          DELAY=$((RANDOM % 6))
          echo "Restarting in $DELAY seconds"
          sleep "$DELAY"

          curl \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/run-bot.yml/dispatches \
            -d '{"ref":"main"}'
