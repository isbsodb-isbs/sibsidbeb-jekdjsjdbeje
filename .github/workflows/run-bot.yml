name: Run ChomeNS

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: chomens-bot
  cancel-in-progress: true

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin

      - name: Run ChomeNS
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DFNGBOOM: ${{ secrets.DFNGBOOM }}
          GH_OAUTH_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
          GH_OAUTH_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
          CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          chmod +x run.sh

          (
            DELAY=$((18000 + RANDOM % 3601))

            echo "Automatic restart scheduled in $DELAY seconds"

            sleep "$DELAY"

            echo "5-6 hour restart reached"

            gh workflow run "Run ChomeNS" \
              --repo "${{ github.repository }}" \
              --ref main

            sleep 5

            gh run cancel "${{ github.run_id }}" \
              --repo "${{ github.repository }}" \
              || true
          ) &

          bash run.sh
          EXIT_CODE=$?

          echo "ChomeNS exited with code $EXIT_CODE"

          echo "Restarting after crash/exit..."

          gh workflow run "Run ChomeNS" \
            --repo "${{ github.repository }}" \
            --ref main \
            || true

          exit "$EXIT_CODE"
