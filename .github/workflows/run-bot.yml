name: Run Chomens Bot

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11
        env:
          MYSQL_DATABASE: chomens_bot
          MYSQL_USER: chomens_bot
          MYSQL_PASSWORD: banana
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install MariaDB client
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      - name: Wait for MariaDB
        run: |
          until mariadb-admin ping \
            -h127.0.0.1 \
            -uchomens_bot \
            -pbanana \
            --silent
          do
            echo "Waiting for MariaDB..."
            sleep 2
          done

      - name: Start restart timer
        run: |
          (
            sleep 19800
            echo "5.5 hours reached, dispatching new workflow..."

            curl -L \
              -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/actions/workflows/run-bot.yml/dispatches \
              -d "{\"ref\":\"${{ github.ref_name }}\"}"

            echo "Stopping current workflow..."
            pkill -f "java -jar" || true
          ) &
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run bot
        run: |
          while true; do
            echo "================================"
            echo "Starting bot..."
            echo "================================"

            java -jar chomens.jar

            EXIT_CODE=$?

            echo "Bot exited with code $EXIT_CODE"
            echo "Restarting in 5 seconds..."

            sleep 5
          done
