name: Run ChomeNS

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: chomens-bot
  cancel-in-progress: true

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull LFS
        run: |
          git lfs install
          git lfs pull

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Verify jar
        run: |
          test -f chomens.jar
          jar tf chomens.jar >/dev/null
          echo "Jar OK"

      - name: Create config
        run: |
          sed \
          -e "s|__DB_PASSWORD__|${{ secrets.DB_PASSWORD }}|g" \
          -e "s|__DISCORD_TOKEN__|${{ secrets.DISCORD_TOKEN }}|g" \
          config.example.yml > config.yml

      - name: Start replacement timer
        run: |
          (
            DELAY=$((3600 + RANDOM % 3601))
            echo "Replacement scheduled in $DELAY seconds"

            sleep "$DELAY"

            curl \
              -X POST \
              -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/actions/workflows/run-bot.yml/dispatches \
              -d '{"ref":"main"}'

            echo "Replacement started"
          ) &

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
          detached: true

      - name: Run bot
        id: run_bot
        run: |
          set +e

          tmux new-session -d -s chomens \
            "java -Xms3G -Xmx3G -XX:+UseG1GC -XX:MaxGCPauseMillis=100 \
             -XX:+ParallelRefProcEnabled -XX:+AlwaysPreTouch -XX:+DisableExplicitGC \
             -jar chomens.jar; \
             echo \$? > /tmp/chomens_exit_code"

          trap 'echo "Shutdown requested"; tmux send-keys -t chomens C-c; sleep 3; tmux kill-session -t chomens 2>/dev/null; exit 0' TERM INT

          while tmux has-session -t chomens 2>/dev/null; do
            sleep 5
          done

          code=$(cat /tmp/chomens_exit_code 2>/dev/null || echo 1)
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "Bot process exited with code $code"

      - name: Restart after crash
        if: always()
        run: |
          DELAY=$((RANDOM % 6))
          echo "Restarting in $DELAY seconds"
          sleep "$DELAY"

          curl \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/run-bot.yml/dispatches \
            -d '{"ref":"main"}'
