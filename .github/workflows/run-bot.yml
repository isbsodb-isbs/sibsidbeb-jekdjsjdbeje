name: Run ChomeNS Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    services:
      mariadb:
        image: mariadb:11
        ports:
          - 3306:3306
        env:
          MARIADB_DATABASE: chomens_bot
          MARIADB_USER: chomens_bot
          MARIADB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MARIADB_ROOT_PASSWORD: rootpassword
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Verify jar
        run: |
          ls -lh chomens.jar
          file chomens.jar
          jar tf chomens.jar > /dev/null

      - name: Generate config.yml
        run: |
          sed \
          -e "s|__DB_PASSWORD__|${{ secrets.DB_PASSWORD }}|g" \
          -e "s|__DISCORD_TOKEN__|${{ secrets.DISCORD_TOKEN }}|g" \
          config.example.yml > config.yml

      - name: Run bot
        run: |
          while true; do
            java -jar chomens.jar

            echo "Bot crashed. Restarting in 5 seconds..."
            sleep 5
          done
